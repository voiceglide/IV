# Requires Pages to be enabled once: Settings → Pages → Source: GitHub Actions.
name: "Deploy to Pages"

on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run types
      - run: npm run build
        env:
          FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
      - run: npm test
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          REQUIRE_BROWSER_TESTS: '1'
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
